<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h2>Weekly Metrics</h2>

<form method="post" action="/submit_metrics">

<h3>Body Metrics</h3>

<input name="weight" placeholder="Weight">
<input name="chest" placeholder="Chest">
<input name="biceps" placeholder="Biceps">
<input name="waist" placeholder="Waist">
<input name="thigh" placeholder="Thigh">
<input name="calf" placeholder="Calf">

<h3>Strength</h3>

<input name="bench" placeholder="Bench Press">
<input name="squat" placeholder="Squat">
<input name="deadlift" placeholder="Deadlift">

<h3>Bodyweight</h3>

<input name="pushups" placeholder="Pushups">
<input name="pullups" placeholder="Pullups">
<input name="plank" placeholder="Plank seconds">

<h3>Cardio</h3>

<input name="vo2max" placeholder="VO2 Max">
<input name="resting_hr" placeholder="Resting Heart Rate">
<input name="hrv" placeholder="HRV">

<br><br>

<button type="submit">Submit</button>

</form>

</body>
</html>
